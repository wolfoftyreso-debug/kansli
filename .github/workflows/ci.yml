name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Enables the Postgres-backed IdP integration suite (auto-skips if unset).
      PIXDRIFT_TEST_OWNER_URL: postgres://pixdrift_owner:pixdrift_owner@127.0.0.1:5432/pixdrift_idp_test
      PIXDRIFT_TEST_DATABASE_URL: postgres://pixdrift_app:pixdrift_app@127.0.0.1:5432/pixdrift_idp_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Create IdP database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pixdrift_owner LOGIN PASSWORD 'pixdrift_owner';
          CREATE ROLE pixdrift_app   LOGIN PASSWORD 'pixdrift_app';
          CREATE DATABASE pixdrift_idp_test OWNER pixdrift_owner;
          SQL

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:packages
      - run: pnpm --filter "@pixdrift/tora-adapter" --filter "@pixdrift/rita-adapter" --filter "@pixdrift/irma-adapter" typecheck
      - run: pnpm test
      - run: pnpm build
